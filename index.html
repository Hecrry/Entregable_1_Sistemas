<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingeniería de Sistemas - Uniamazonia</title>
    
    <!-- Favicon -->
    <link rel="icon" href="img/Logo-img.png" type="image/png">
    
    <!-- Fuente Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- Estilos locales -->
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <main class="hero-container">
        
        <!-- Texto encima del logo -->
        <div id="textWrapper" class="text-wrapper hidden">
            <span class="system-tag">&lt;system.init&gt;</span>
            <h1 id="glitchTitle" class="glitch-title">Programa de Ingeniería de Sistemas</h1>
            <p class="sub-code">// Universidad de la Amazonia</p>
        </div>

        <!-- Botón circular del logo -->
        <button id="logoBtn" class="btn-logo animate__animated animate__backInDown" type="button" title="¡Haz clic para interactuar!">
            <video id="logoVideo" muted playsinline preload="auto">
                <source src="img/Logo-gif.mp4" type="video/mp4">
                Tu navegador no soporta video HTML5.
            </video>
        </button>

    </main>

    <script src="JS/main.js"></script>
</body>
</html>
